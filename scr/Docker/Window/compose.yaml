services:
  windows:
    image: dockurr/windows:latest
    container_name: windows-11

    environment:
      USERNAME: "user1"
      PASSWORD: "hipassword"

      # EXACT Windows virtual disk capacity
      DISK_SIZE: "32G"

      RAM_SIZE: "4G"
      CPU_CORES: "2"

    devices:
      - /dev/kvm
      - /dev/net/tun

    cap_add:
      - NET_ADMIN

    ports:
      - "8006:8006"
      - "3389:3389/tcp"
      - "3389:3389/udp"

    volumes:
      - ./Window-{version}.iso:/custom.iso
      - ./win_storage:/storage

    restart: "no"
