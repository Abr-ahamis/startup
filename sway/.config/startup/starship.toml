# NEO STARSHIP: a compact two-line prompt with useful project context.

add_newline = true
command_timeout = 200

format = """
$os\
$directory\
$git_branch\
$git_status\
$python\
$nodejs\
$rust\
$docker_context\
$cmd_duration
$line_break\
$character
"""

[os]
disabled = false
style = "cyan"
format = "[$symbol]($style) "

[os.symbols]
Arch = "󰣇"
Ubuntu = "󰕈"
Debian = "󰣚"
Kali = ""
Linux = "󰌽"

[directory]
style = "bold cyan"
repo_root_style = "bold cyan"
truncation_length = 3
truncation_symbol = "…/"
home_symbol = "~"
read_only = " 󰌾"
read_only_style = "red"
repo_root_format = "[$repo_root]($repo_root_style)[$path]($style)[$read_only]($read_only_style) "

[git_branch]
symbol = " "
format = "[$symbol$branch]($style) "
style = "bold cyan"

[git_status]
format = "[$all_status$ahead_behind]($style) "
style = "cyan"
ahead = "⇡${count}"
behind = "⇣${count}"
diverged = "⇕⇡${ahead_count}⇣${behind_count}"
conflicted = " "
untracked = "?${count} "
modified = "${count} "
staged = "●${count} "
renamed = "»${count} "
deleted = "✘${count} "
stashed = ""
up_to_date = " "

[cmd_duration]
min_time = 1500
format = "[ 󰔟 $duration]($style) "
style = "dimmed cyan"
show_milliseconds = true

[python]
symbol = " "
style = "cyan"
format = "[$symbol$version]($style) "

[nodejs]
symbol = " "
style = "cyan"
format = "[$symbol$version]($style) "

[rust]
symbol = " "
style = "cyan"
format = "[$symbol$version]($style) "

[docker_context]
symbol = " "
style = "cyan"
format = "[$symbol$context]($style) "

[character]
success_symbol = "[❯](bold cyan)"
error_symbol = "[✗](bold red)"
vimcmd_symbol = "[❮](bold cyan)"
